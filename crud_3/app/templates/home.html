<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button><a href="{% url 'create' %}">Create</a></button><br><br>
    <button><a href="{% url 'csv' %}">Export Data To CSV</a></button><br><br>
    <button><a href="{% url 'logout' %}">Logout</a></button><br><br>
    <table>
        <tr>
            <td>Name</td>
            <td>Marks</td>
            <td>Batch</td>
            <td>Branch</td>
            <td colspan="2">Actions</td>
        </tr>
    {% for i in d %}
        <tr>
            <td>{{i.name}}</td>
            <td>{{i.marks}}</td>
            <td>{{i.batch}}</td>
            <td>{{i.branch}}</td>
            <td><button><a href="{% url 'update' i.id %}">Update</a></button></td>
            <td><button><a href="{% url 'delete' i.id %}">Delete</a></button></td>
        </tr>
    {% endfor %}
    </table>
</body>
</html>
